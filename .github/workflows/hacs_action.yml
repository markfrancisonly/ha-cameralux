name: "HACS Validate"
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  hacs:
    name: "HACS validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: "actions/checkout@v7"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
